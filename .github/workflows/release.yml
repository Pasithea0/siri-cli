name: Release

# Manually triggered semantic-release.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run — compute the next version but don't publish."
        type: boolean
        default: false

permissions:
  contents: write # needed to push the release commit/tag and create the release

jobs:
  release:
    runs-on: macos-latest
    concurrency: release

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so semantic-release can see all commits

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install release tooling
        run: npm ci

      - name: Install Python build backend
        run: python -m pip install --upgrade pip build

      - name: Run semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            npx semantic-release --dry-run
          else
            npx semantic-release
          fi

      - name: Finalize Homebrew formula sha256
        # After semantic-release tags + creates the release, GitHub has
        # generated the source tarball. Fetch it and patch the formula's
        # url/sha256 to the exact released source, then commit + push.
        if: ${{ ! inputs.dry_run }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          VERSION="$(git describe --tags --abbrev=0 2>/dev/null | sed 's/^v//' || true)"
          if [ -z "$VERSION" ]; then
            echo "no tag found; skipping formula finalize"
            exit 0
          fi
          echo "finalizing formula for v${VERSION}"
          python3 scripts/finalize_formula.py "${VERSION}"
          if ! git diff --quiet Formula/siri-cli.rb; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add Formula/siri-cli.rb
            git commit -m "chore(release): update Homebrew formula sha256 for v${VERSION} [skip ci]"
            git push origin HEAD:${GITHUB_REF_NAME}
          else
            echo "formula sha256 already correct"
          fi

      - name: Sync formula to Homebrew tap
        # Mirror the updated formula into the official tap repo so
        # `brew tap Pasithea0/homebrew-siri-cli && brew install siri-cli`
        # pulls the release-correct formula.
        # Uses the GH_TOKEN PAT secret (fine-grained, has write access to BOTH
        # repos).
        if: ${{ ! inputs.dry_run }}
        env:
          TAP_REPO: Pasithea0/homebrew-siri-cli
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          set -e
          VERSION="$(git describe --tags --abbrev=0 2>/dev/null | sed 's/^v//' || true)"
          if [ -z "$VERSION" ]; then
            echo "no tag; skipping tap sync"
            exit 0
          fi
          if [ -z "$GH_TOKEN" ]; then
            echo "GH_TOKEN secret not set; skipping tap sync (formula stays in source repo)"
            exit 0
          fi
          rm -rf /tmp/tap-sync
          git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/${TAP_REPO}.git" /tmp/tap-sync
          cp Formula/siri-cli.rb /tmp/tap-sync/Formula/siri-cli.rb
          cd /tmp/tap-sync
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet Formula/siri-cli.rb; then
            echo "tap formula already in sync"
          else
            git add Formula/siri-cli.rb
            git commit -m "chore(release): sync siri-cli formula v${VERSION}"
            git push
            echo "pushed formula to ${TAP_REPO}"
          fi
