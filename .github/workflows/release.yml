name: Release

# Manually triggered semantic-release.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run — compute the next version but don't publish."
        type: boolean
        default: false

permissions:
  contents: write # needed to push the release commit/tag and create the release

jobs:
  release:
    runs-on: macos-latest
    concurrency: release

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so semantic-release can see all commits
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install release tooling
        run: npm ci

      - name: Install Python build backend
        run: python -m pip install --upgrade pip build

      - name: Run semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            npx semantic-release --dry-run
          else
            npx semantic-release
          fi
